#VRML_SIM R2025a utf8

PROTO Goal [
  field SFString name "goal"
  field SFVec3f translation 0 0 0.1
  field SFFloat radius 0.3
  field SFFloat height 0.2
  field SFColor color 1 0 0
]
{
  Solid {
    name IS name
    translation IS translation
    children [
      Shape {
        appearance PBRAppearance {
          baseColor IS color
          roughness 0.3
          metalness 0
        }
        geometry Cylinder {
          radius IS radius
          height IS height
        }
      }
    ]
  }
}
