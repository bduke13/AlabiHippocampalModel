#VRML_SIM R2025a utf8

PROTO Wall [
  field SFString name "wall"
  field SFVec3f translation 0 0 0.5
  field SFRotation rotation 0 0 1 0
  field SFVec3f size 4 0.2 1
  field SFColor color 0.6 0.6 0.6
]
{
  Solid {
    name IS name
    translation IS translation
    rotation IS rotation

    children [
      Shape {
        appearance PBRAppearance {
          baseColor IS color
          roughness 0.8
          metalness 0
        }
        geometry Box {
          size IS size
        }
      }
    ]

    boundingObject Box {
      size IS size
    }
  }
}
